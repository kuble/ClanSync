# 네이티브 Git 연동이 정상이면 main 푸시마다 Vercel이 알아서 빌드합니다.
# 이 워크플로는 연동 복구 전·긴급용 수동 배포만 (push와 겹치면 이중 빌드됨).
#
# 실행: GitHub Actions → Deploy production (Vercel CLI) → Run workflow
# Secrets: VERCEL_TOKEN — https://vercel.com/account/tokens
# 대상(Vercel에서 확인, 비밀 아님):
#   • org  team_UaVXQMdZ2aJQUkYHxU7iSzN3  (slug: clansync)
#   • app  prj_UwqBACb65GoSqFfqPekMNe15Og8T (이름: clan-sync)

name: Deploy production (Vercel CLI)

on:
  workflow_dispatch:

# 기본 GITHUB_TOKEN 권한 최소화(checkout에 필요한 읽기만).
permissions:
  contents: read

concurrency:
  group: vercel-prod-clan-sync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_UaVXQMdZ2aJQUkYHxU7iSzN3
      VERCEL_SCOPE: clansync
      VERCEL_PROJECT_ID: prj_UwqBACb65GoSqFfqPekMNe15Og8T

    steps:
      - uses: actions/checkout@v4

      - name: Show HEAD (manual run)
        run: |
          echo "::notice::GITHUB_SHA=${GITHUB_SHA}"
          git show -s --format='%h %s' "$GITHUB_SHA"

      - name: Deploy to clan-sync production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "::error::GitHub 레포 Secret VERCEL_TOKEN 이 없습니다. Vercel → Account → Tokens에서 발급해 Actions Secrets에 저장하세요. 안내 docs/VERCEL_PRODUCTION_SYNC.md"
            exit 1
          fi

          mkdir -p .vercel
          jq -nc --arg o "$VERCEL_ORG_ID" --arg p "$VERCEL_PROJECT_ID" \
            '{"orgId": $o, "projectId": $p}' > .vercel/project.json

          echo "::notice::clan-sync (prj_UwqBAC…) 프로덕션으로 원격 빌드·배포를 시작합니다…"
          npx --yes vercel@latest deploy --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE"
          echo "::notice::완료. Vercel 팀 ClanSync 프로젝트 clan-sync Deployments를 확인하세요."
