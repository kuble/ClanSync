<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클랜 창단 기념 배지 · 5종 비교</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111512; color: #f5f3eb; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    main { width: min(1120px, 100%); margin: auto; padding: 36px 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .eyebrow { color: #a4b3a8; font-size: 12px; letter-spacing: .08em; margin: 0 0 10px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0; }
    .status { font-size: 13px; color: #bac4bb; margin: 0; white-space: nowrap; }
    .case { border: 1px solid #4a5144; border-radius: 16px; padding: 24px 18px 20px; background: radial-gradient(ellipse at 50% 0%, #273328, #191f19 70%); box-shadow: inset 0 1px 0 #89917940, inset 0 8px 22px #0006; }
    .collection { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    article { min-width: 0; text-align: center; }
    .pin { display: flex; align-items: center; justify-content: center; height: 194px; }
    .pin a { display: block; width: 100%; }
    .pin img { display: block; width: 100%; max-width: 186px; aspect-ratio: 1; object-fit: contain; margin: auto; }
    a:focus-visible { outline: 2px solid #b8dcc1; outline-offset: 5px; border-radius: 6px; }
    h2 { font-size: 14px; font-weight: 600; margin: 14px 0 8px; line-height: 1.5; }
    .number { color: #d3b678; margin-right: 7px; font-variant-numeric: tabular-nums; }
    .meaning { font-size: 12px; color: #bdc7bd; margin: 0; line-height: 1.7; word-break: keep-all; }
    .samples { margin-top: 28px; padding-top: 22px; border-top: 1px solid #41493e; }
    .sample-heading { font-size: 12px; color: #bfc9c0; margin: 0 0 16px; }
    .sample-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .pair { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .swatch { display: flex; align-items: center; justify-content: center; width: 74px; height: 82px; border-radius: 7px; }
    .swatch.dark { background: #111512; }
    .swatch.light { background: #f3f0e6; }
    .swatch img { width: 64px; height: 64px; object-fit: contain; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; color: #aeb9af; font-size: 12px; margin-top: 20px; }
    footer p { margin: 0; }
    @media (max-width: 850px) {
      .collection, .sample-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 18px; }
      .pin { height: 186px; }
    }
    @media (max-width: 560px) {
      main { padding: 24px 16px; }
      header { align-items: start; flex-direction: column; gap: 12px; }
      h1 { font-size: 23px; }
      .case { padding: 18px 12px; }
      .collection, .sample-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
      .pin { height: 150px; }
      .pin img { max-width: 150px; }
      .pair { gap: 4px; }
      .swatch { width: 64px; height: 74px; }
      .swatch img { width: 60px; height: 60px; }
    }
    @media (max-width: 350px) {
      .collection, .sample-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">기념 · 역사 / 창단</p><h1>우리의 시작을 기념하는 배지</h1></div>
      <p class="status">5종 시안 · 선택 전</p>
    </header>
    <section class="case" aria-label="창단 배지 후보 다섯 종">
      <div class="collection">
        <article>
          <div class="pin"><a href="01-first-light.png" aria-label="첫빛의 인장 원본 보기"><img src="01-first-light.png" alt="금색 원형 인장 안의 아이보리 별과 민트빛 새벽"></a></div>
          <h2><span class="number">01</span>첫빛의 인장</h2>
          <p class="meaning">클랜의 시작을 새긴<br>기념 인장</p>
        </article>
        <article>
          <div class="pin"><a href="02-first-banner.png" aria-label="첫 깃발 원본 보기"><img src="02-first-banner.png" alt="금색 깃대와 녹색 아이보리 깃발의 에나멜 핀"></a></div>
          <h2><span class="number">02</span>첫 깃발</h2>
          <p class="meaning">우리 이름으로<br>처음 세운 깃발</p>
        </article>
        <article>
          <div class="pin"><a href="03-one-name.png" aria-label="하나의 이름 원본 보기"><img src="03-one-name.png" alt="은색 육각 테두리 안에서 연결되는 세 금색 고리"></a></div>
          <h2><span class="number">03</span>하나의 이름</h2>
          <p class="meaning">서로 다른 사람들이<br>하나로 연결된 순간</p>
        </article>
        <article>
          <div class="pin"><a href="04-first-chapter.png" aria-label="우리의 첫 장 원본 보기"><img src="04-first-chapter.png" alt="금색 별과 녹색 책갈피가 있는 펼쳐진 아이보리 책"></a></div>
          <h2><span class="number">04</span>우리의 첫 장</h2>
          <p class="meaning">함께 쓰기 시작한<br>첫 번째 이야기</p>
        </article>
        <article>
          <div class="pin"><a href="05-putting-down-roots.png" aria-label="뿌리내린 약속 원본 보기"><img src="05-putting-down-roots.png" alt="금색 물방울 테두리 안의 녹색 새잎과 뻗어가는 뿌리"></a></div>
          <h2><span class="number">05</span>뿌리내린 약속</h2>
          <p class="meaning">처음 맺은 약속이<br>뿌리내리고 자라는 모습</p>
        </article>
      </div>
      <section class="samples" aria-label="어두운 바탕과 밝은 바탕에서 배지 크기 비교">
        <p class="sample-heading">케이스 크기 비교 · 64px · 어두운 바탕 / 밝은 바탕</p>
        <div class="sample-grid">
          <div class="pair"><div class="swatch dark"><img src="01-first-light.png" alt="첫빛의 인장 64px 어두운 바탕"></div><div class="swatch light"><img src="01-first-light.png" alt="첫빛의 인장 64px 밝은 바탕"></div></div>
          <div class="pair"><div class="swatch dark"><img src="02-first-banner.png" alt="첫 깃발 64px 어두운 바탕"></div><div class="swatch light"><img src="02-first-banner.png" alt="첫 깃발 64px 밝은 바탕"></div></div>
          <div class="pair"><div class="swatch dark"><img src="03-one-name.png" alt="하나의 이름 64px 어두운 바탕"></div><div class="swatch light"><img src="03-one-name.png" alt="하나의 이름 64px 밝은 바탕"></div></div>
          <div class="pair"><div class="swatch dark"><img src="04-first-chapter.png" alt="우리의 첫 장 64px 어두운 바탕"></div><div class="swatch light"><img src="04-first-chapter.png" alt="우리의 첫 장 64px 밝은 바탕"></div></div>
          <div class="pair"><div class="swatch dark"><img src="05-putting-down-roots.png" alt="뿌리내린 약속 64px 어두운 바탕"></div><div class="swatch light"><img src="05-putting-down-roots.png" alt="뿌리내린 약속 64px 밝은 바탕"></div></div>
        </div>
      </section>
    </section>
    <footer><p>금속 테두리 · 에나멜 질감 · 투명 배경</p><p>배지를 누르면 원본 확대</p></footer>
  </main>
</body>
</html>
