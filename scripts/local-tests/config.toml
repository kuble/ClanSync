project_id = "clansync-automated-tests"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = true
port = 55434

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3010"
additional_redirect_urls = ["http://localhost:3010"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 1000
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
