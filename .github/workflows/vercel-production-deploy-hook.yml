# Vercel 자동 빌드(깃허브 푸시 → webhook)가 끊긴 상태에서도
# 저장소 최신(main) 코드로 프로덕션 빌드를 강제로 돌립니다.
#
# 준비: Vercel → clan-sync 프로젝트 → Settings → Git → Deploy Hooks
#       이름 예: gh-main-sync, 브랜치: main → 발급 URL을
#       GitHub 레포 Secrets 에 `VERCEL_DEPLOY_HOOK` 으로 등록
#
# 검증 없이 빌드를 트리거하므로 훅 URL은 패스워드처럼 취급할 것.

name: Trigger Vercel production (deploy hook)

# push 트리거는 제외: 네이티브 Git 푸시와 중복되므로 deploy hook·CLI는 수동(workflow_dispatch)만.
# 수동 디버깅·백업용으로만 사용.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST deploy hook (main → production build)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK 시크릿이 비어 있습니다. Settings → Secrets and variables → Actions → Repository secrets 에 추가한 뒤 다시 실행하세요. 안내: docs/VERCEL_PRODUCTION_SYNC.md"
            exit 1
          fi
          case "$VERCEL_DEPLOY_HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*)
              ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK URL 형식이 잘못되었습니다. Vercel → 프로젝트 → Settings → Git → Deploy Hooks 에서 받은 주소만 사용해야 합니다. 예: https://api.vercel.com/v1/integrations/deploy/prj_…/..."
              exit 1
              ;;
          esac

          HOOK_EXPECTED_PROJECT="prj_UwqBACb65GoSqFfqPekMNe15Og8T"
          if ! printf '%s\n' "$VERCEL_DEPLOY_HOOK" | grep -q "/deploy/${HOOK_EXPECTED_PROJECT}/"; then
            echo "::warning::Deploy Hook URL의 프로젝트 ID가 이 레포 표준 클라우드 앱(${HOOK_EXPECTED_PROJECT})과 다릅니다. 잘못된 프로젝트에 줄이 추가됩니다. 설정 → 같은 ID로 훅을 다시 만드세요."
          fi

          echo "::notice::Deploy Hook 호출 중…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" -o deploy-hook-response.json
          cat deploy-hook-response.json
          echo ""
          python3 << 'PYEOF'
          import json, sys

          raw = open("deploy-hook-response.json", encoding="utf-8").read().strip()
          if not raw:
              print("::error::Vercel 응답이 비어 있습니다.", file=sys.stderr)
              sys.exit(1)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::JSON 파싱 실패(잘못된 URL 또는 HTML 응답일 수 있습니다): {e}", file=sys.stderr)
              sys.exit(1)
          job = data.get("job")
          if not isinstance(job, dict) or not job.get("id"):
              print(f"::error::Vercel 응답에 job이 없습니다(Deploy Hook 생성 직후 훅 URL이 또는 다른 페이지 URL을 넣었을 수 있습니다). 응답: {json.dumps(data)[:800]}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: job.id={job.get('id')} state={job.get('state')}")
          PYEOF
